services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate() }"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: salesflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      DEMO_REALTIME: "1"
    ports: ["8000:8000"]
    volumes:
      # serve the built SPA inside the container (build it first: cd frontend && npm run build)
      - ./frontend/dist:/srv/frontend/dist:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
